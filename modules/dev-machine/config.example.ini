; Lokale Konfiguration: als config.ini nur ueber configure-credentials.ps1 erzeugen.
[WSL]
DISTRIBUTION=Ubuntu-24.04

[NETWORK]
NETWORKING_MODE=mirrored
WSL_MEMORY=8GB
WSL_PROCESSORS=4

[KUBERNETES]
KUBERNETES_VERSION=v1.30.0
MINIKUBE_DRIVER=docker
MINIKUBE_MEMORY=8192
MINIKUBE_CPUS=4
ENVOY_GATEWAY_VERSION=v1.2.1
NAMESPACE=dev-infra

[CREDENTIALS]
APP_USERNAME=
APP_PASSWORD=

[PORTS]
MONGODB_PORT=27017
RABBITMQ_AMQP_PORT=5672
RABBITMQ_MGMT_PORT=15672
MONGODB_EXPRESS_PORT=8081
GRAFANA_PORT=3000
PROMETHEUS_PORT=9090
LOKI_PORT=3100
ALERTMANAGER_PORT=9093
GATEWAY_HTTP_PORT=80

[PATHS]
PROJECT_ROOT=c:\projects
WSL_PROJECT_ROOT=/mnt/c/projects

[SHELL_SCRIPTS]
SHELL_SCRIPTS_REPO_URL=https://example.com/git/shell-scripts.git
SHELL_SCRIPTS_PATH=$HOME/workspace/shell-scripts.git
INSTALL_MINIKUBE=1
